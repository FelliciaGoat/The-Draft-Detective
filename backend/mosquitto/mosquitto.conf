# Mosquitto configuration for LOCAL DEVELOPMENT ONLY.
#
# Anonymous access is convenient for a hackathon prototype but NOT safe on a shared network.
# For anything real: set `allow_anonymous false`, create a password file
# (mosquitto_passwd) and add `password_file`, and use TLS.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
